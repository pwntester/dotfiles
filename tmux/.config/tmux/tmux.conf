# Terminal multiplexer
# https://github.com/tmux/tmux

# Customize Catppuccin theme
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_right_separator "█"

set -g @catppuccin_window_text " #(pgrep -P #{pane_pid} 2>/dev/null | xargs ps -o command= 2>/dev/null | grep -qE 'devcontainer|claude|copilot' && echo '📦 ')#{b:pane_current_path}"
set -g @catppuccin_window_current_text " #(pgrep -P #{pane_pid} 2>/dev/null | xargs ps -o command= 2>/dev/null | grep -qE 'devcontainer|claude|copilot' && echo '📦 ')#{b:pane_current_path}"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"
set -g @catppuccin_pane_border_style "fg=#{@thm_surface_2}"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_surface_2}"
set -g @catppuccin_status_background "#24273a"


# Floax
set -g @floax-bind 'p'
set -g @floax-bind-menu 'P'
set -g @floax-border-coloer 'yellow'
set -g @floax-text-coloer 'yellow'
set -g @floax-change-path 'true'

# Terminal

set -g default-terminal "${TERM}"

# Enable mouse support
set -g mouse on

# Enable focus events for neovim
set -g focus-events on

# Dim inactive panes (Catppuccin Macchiato compatible)
# Using overlay0 for more noticeable dimming (similar to neovim's 60% dimming)
set -g window-style 'fg=#6e738d,bg=#1e2030'
set -g window-active-style 'fg=#cad3f5,bg=#24273a'

# Start windows and pane numbering on 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Required for image.nvim to work
set -gq allow-passthrough on

# Shift-Alt vim keys to switch windows
#bind -n M-H previous-window
#bind -n M-L next-window

# Fix colors
set-option -sa terminal-overrides ",xterm*:Tc"

# Set vim mode
set-window-option -g mode-keys vi

# Keybindings
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y   send-keys -X copy-selection-and-cancel
bind-key < swap-window -d -t -1 # tmux-prefix, Shift + Left
bind-key > swap-window -d -t +1 # tmux-prefix, Shift + Right

# CWD on splits
bind '%' split-window -c '#{pane_current_path}' -h
bind '"' split-window -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# Lazygit/gitui
bind -N "⌘+g lazygit " g new-window -c "#{pane_current_path}" -n "🌳" "lazygit 2> /dev/null"
#bind -N "⌘+g gitui" g new-window -c "#{pane_current_path}" -n "🌳" "gitui 2> /dev/null"

# Sesh integration
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
set -g detach-on-destroy off  # don't exit from tmux when closing a session
bind-key "T" display-popup -E -w 40% "sesh connect \"$(
	sesh list -i | gum filter --limit 1 --fuzzy --no-sort --placeholder 'Pick a sesh' --prompt='⚡'
)\""

# Smart pane resizing with awareness of Neovim splits.
bind-key -n M-h if -F "#{@pane-is-vim}" 'send-keys M-h' 'resize-pane -L 3'
bind-key -n M-j if -F "#{@pane-is-vim}" 'send-keys M-j' 'resize-pane -D 3'
bind-key -n M-k if -F "#{@pane-is-vim}" 'send-keys M-k' 'resize-pane -U 3'
bind-key -n M-l if -F "#{@pane-is-vim}" 'send-keys M-l' 'resize-pane -R 3'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator' # works with smart-splits
set -g @plugin 'omerxx/tmux-floax'

set -g @thumbs-command 'echo -n {} | pbcopy && tmux display-message \"Copied {}\"'

run '~/.config/tmux/plugins/tpm/tpm'
run '~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux'

set -g status-left ""
#set -ag status-right '#[fg=#{@thm_crust},bg=#{@thm_teal}] session: #S '

# Ensure that everything on the right side of the status line is included.
set -g status-right-length 100
